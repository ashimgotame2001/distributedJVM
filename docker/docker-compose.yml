services:
  node-a:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: microjvm-node:local
    pull_policy: never
    environment:
      NODE_ID: node-a
      GRPC_PORT: "9090"
      ARTIFACT_ROOT: /app/artifacts
      SPIKE_ENABLED: "false"
    ports:
      - "9091:9090"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9090'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  node-b:
    image: microjvm-node:local
    pull_policy: never
    depends_on:
      node-a:
        condition: service_started
    environment:
      NODE_ID: node-b
      GRPC_PORT: "9090"
      ARTIFACT_ROOT: /app/artifacts
      SPIKE_ENABLED: "false"
    ports:
      - "9092:9090"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9090'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  node-c:
    image: microjvm-node:local
    pull_policy: never
    depends_on:
      node-a:
        condition: service_started
    environment:
      NODE_ID: node-c
      GRPC_PORT: "9090"
      ARTIFACT_ROOT: /app/artifacts
      SPIKE_ENABLED: "false"
    ports:
      - "9093:9090"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9090'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  spike:
    image: microjvm-node:local
    pull_policy: never
    depends_on:
      node-a:
        condition: service_healthy
      node-b:
        condition: service_healthy
    environment:
      NODE_ID: spike-client
      GRPC_PORT: "9099"
      PEER_HOST: node-b
      PEER_PORT: "9090"
      ARTIFACT_ROOT: /app/artifacts
      SPIKE_ENABLED: "true"
    restart: "no"
