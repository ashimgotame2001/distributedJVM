syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.distributed.jvm.grpc";
option java_outer_classname = "TaskCoordinatorProto";

service CoordinatorService {
  rpc coordinateTask(CoordinateRequest) returns (CoordinatorResponse);
}

message CoordinateRequest {
  bytes taskBytes = 1;
}

message CoordinatorResponse {
  bytes result = 1;
}
