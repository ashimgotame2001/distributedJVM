[versions]
java = "21"
spring-boot = "3.4.5"
grpc = "1.71.0"
protobuf = "4.30.2"
protobuf-plugin = "0.9.5"
grpc-spring = "3.1.0.RELEASE"
junit = "5.11.4"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-services = { module = "io.grpc:grpc-services", version.ref = "grpc" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
javax-annotation = { module = "javax.annotation:javax.annotation-api", version = "1.3.2" }
grpc-server-spring = { module = "net.devh:grpc-server-spring-boot-starter", version.ref = "grpc-spring" }
grpc-client-spring = { module = "net.devh:grpc-client-spring-boot-starter", version.ref = "grpc-spring" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
